  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 280px; background: #111; overflow-y: auto;
    border-right: 1px solid #222; transition: transform .3s ease; flex-shrink: 0;
  }
  #sidebar.hidden { transform: translateX(-100%); margin-right: -280px; }
  #sidebar h1 {
    font-size: 15px; padding: 16px; background: #1a1a1a;
    border-bottom: 1px solid #222; color: #f0c330;
  }
  #sidebar .group { border-bottom: 1px solid #1c1c1c; }
  #sidebar .group-title {
    font-size: 12px; padding: 10px 14px; background: #161616; color: #8fb9c1;
    text-transform: uppercase; letter-spacing: .5px; font-weight: 600;
  }
  #sidebar .scene-item {
    font-size: 13px; padding: 9px 14px 9px 22px; cursor: pointer;
    color: #ccc; border-left: 3px solid transparent; transition: background .15s;
  }
  #sidebar .scene-item:hover { background: #1e1e1e; color: #fff; }
  #sidebar .scene-item.active {
    background: #5d9ea7; color: #fff; border-left-color: #f0c330;
  }

  /* Viewer */
  #viewer-wrap { flex: 1; position: relative; }
  #panorama { width: 100%; height: 100%; }

  #toggle-sidebar {
    position: absolute; top: 14px; left: 14px; z-index: 100;
    background: rgba(0,0,0,.6); border: 1px solid #333; color: #fff;
    width: 40px; height: 40px; border-radius: 6px; cursor: pointer;
    font-size: 18px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
  }
  #toggle-sidebar:hover { background: rgba(93,158,167,.85); }

  #scene-title {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.6); color: #fff; padding: 8px 18px;
    border-radius: 20px; font-size: 14px; backdrop-filter: blur(6px);
    z-index: 100; pointer-events: none; white-space: nowrap;
  }

  #loading {
    position: fixed; inset: 0; background: #000; display: flex;
    align-items: center; justify-content: center; z-index: 9999;
    color: #f0c330; font-size: 14px; letter-spacing: 1px; transition: opacity .4s;
  }
  #loading.done { opacity: 0; pointer-events: none; }

  .pnlm-about-msg { display: none !important; }
  .pnlm-ctrl.pnlm-info { display: none !important; }

/* =========================================================
   KHỞI TẠO
   ========================================================= */
const viewerEl = document.getElementById("panorama");
const sidebarEl = document.getElementById("sidebar");
const listEl = document.getElementById("scene-list");
const titleEl = document.getElementById("scene-title");
const toggleBtn = document.getElementById("toggle-sidebar");
const loadingEl = document.getElementById("loading");

let viewer = null;

function buildSceneConfig(scene) {
  const hotspots = (scene.hotspots || []).map(h => ({
    pitch: h.pitch,
    yaw: h.yaw,
    type: "info",
    text: h.title,
    clickHandler: () => goToScene(h.target)
  }));

  return {
    type: "equirectangular",
    panorama: scene.image,
    yaw: scene.yaw || 0,
    pitch: scene.pitch || 0,
    hfov: scene.hfov || 100,
    autoLoad: true,
    showControls: true,
    compass: false,
    hotSpots: hotspots,
    backgroundColor: [0, 0, 0]
  };
}

function goToScene(sceneId) {
  const scene = SCENES.find(s => s.id === sceneId);
  if (!scene) { console.warn("Không tìm thấy scene:", sceneId); return; }

  if (viewer) viewer.destroy();
  viewer = pannellum.viewer(viewerEl, buildSceneConfig(scene));

  titleEl.textContent = scene.title;
  highlightSidebar(scene.id);
}

function renderSidebar() {
  const groups = {};
  SCENES.forEach(s => {
    if (!groups[s.group]) groups[s.group] = [];
    groups[s.group].push(s);
  });

  const html = Object.entries(groups).map(([groupName, scenes]) => `
    <div class="group">
      <div class="group-title">${groupName}</div>
      ${scenes.map(s => `<div class="scene-item" data-id="${s.id}">${s.title}</div>`).join("")}
    </div>
  `).join("");

  listEl.innerHTML = html;
  listEl.querySelectorAll(".scene-item").forEach(el => {
    el.addEventListener("click", () => goToScene(el.dataset.id));
  });
}

function highlightSidebar(sceneId) {
  listEl.querySelectorAll(".scene-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === sceneId);
  });
}

toggleBtn.addEventListener("click", () => {
  sidebarEl.classList.toggle("hidden");
  setTimeout(() => viewer && viewer.resize(), 320);
});

window.addEventListener("load", () => {
  renderSidebar();
  goToScene(SCENES[0].id);
  setTimeout(() => loadingEl.classList.add("done"), 800);
});

window.addEventListener("resize", () => viewer && viewer.resize());
</script>
